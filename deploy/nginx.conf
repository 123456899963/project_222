server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 对齐后端 MAX_REQUEST_BODY_MB=6（TEST_PLAN DEF-02）
    client_max_body_size 6m;

    # 视频上传：50MB 文件 + multipart 余量（对齐 MAX_VIDEO_REQUEST_BODY_MB=52）
    # 其余 /api/ 仍受 6MB 限制；精确匹配避免放宽整个 API。
    location = /api/v1/admin/media/video {
        client_max_body_size 52m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端 API：保留原始路径（location 带 /，proxy_pass 不带 URI 部分）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传图片由后端静态挂载提供
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 带哈希的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
